services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: maletas
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: testing
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: maletas
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      SOURCE_WORKBOOK: /seed/source.xlsm
      SEED_FROM_WORKBOOK: "true"
    volumes:
      - "./MANIFIESTO MALETAS 21 DE AGOSTO DE 2026 (1).xlsm:/seed/source.xlsm:ro"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MODE: testing
        NGINX_CONFIG: nginx.conf
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
