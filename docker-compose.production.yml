name: maletas-production

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./mongo_produ/.env
    environment:
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_FROM_WORKBOOK: "false"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${API_WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

